# Daily job for the Supabase + Cloudflare deployment: timetables → Postgres, static map data and monthly
# CSV downloads → Cloudflare R2. Free on public repositories. See docs/deploy.md for the secrets.
name: daily-sync

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 04:30/05:30 Madrid, after the nightly roll-up in Postgres (02:15 UTC)
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps to run (gtfs static exports), empty = all"
        required: false
        default: ""
      all_months:
        description: "Rebuild every monthly export file"
        type: boolean
        default: false

# the job only reads the repository; this caps GITHUB_TOKEN whatever the repository default is
permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - name: Sync timetables, static data and exports
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # inputs go through env so the shell never runs them as code; $STEPS unquoted so "gtfs static" splits
          STEPS: ${{ inputs.steps }}
          ALL_MONTHS: ${{ inputs.all_months && '--all-months' || '' }}
        run: node --no-warnings scripts/sync-supabase.mjs $STEPS $ALL_MONTHS
